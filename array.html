<!DOCTYPE html>
<html>
<body>
<h1>JavaScript arrays are not homogeneous. They are heterogeneous.
    <br>Reason - The reason is that JavaScript is a dynamically typed language.

In JavaScript, variables do not have fixed data types. Instead, values have types. <br>
So an array is simply a container that can hold any kind of value.
</h1>
<script>

const a = ["horse", 4, NaN];

document.write("Array: " + a + "<br>");
document.write("Type: " + typeof(a) + "<br>");
document.write("Is Array? " + Array.isArray(a));

</script>

</body>
</html>
