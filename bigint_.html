<!DOCTYPE html>
<html>
<head>
    <title>BigInt Example</title>
</head>
<body>

    <h2>JavaScript BigInt</h2>

    <script>

        // BigInt is used to store very large integer values.
        // Add 'n' at the end of the number to make it a BigInt.

        let bigNumber = 123456789123456789123456789123456789n;

        document.write("BigInt Value: " + bigNumber + "<br>");
        document.write("Data Type: " + typeof bigNumber);

    </script>

</body>
</html>
