<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title><style>.submitbutton{
    padding: 10px;
    width:200px;
    height:35px;
    background-color: rgb(227, 55, 55);
    border: none;
    border-radius: 2px;
    cursor: pointer;
    transition: width 0.15s, opacity 0.15s,color 0.15s, box-shadow 0.15s;
}
*{
    box-sizing: border-box;
}
body{
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
     font-family: Arial, sans-serif;
    background-color: #f4f6f8;
    margin:0;
}
.submitbutton:hover{
   opacity: 0.7;
   color: white;
   font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
   font-weight: bold;
   box-shadow: 5px 5px 10px black;
   width: 210px;
   height:37px
}
.resetbutton{
    padding: 10px;
    width:200px;
    height:35px;
    background-color: rgb(36, 211, 153);
    border: none;
    border-radius: 2px;
    cursor: pointer;
    margin-left: 5px;
    transition: width 0.15s, opacity 0.15s,color 0.15s, box-shadow 0.15s;
}
.resetbutton:hover{
   opacity: 0.7;
   color: white;
   font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
   font-weight: bold;
   box-shadow: 5px 5px 10px black;
   width: 210px;
   height:37px
}
.form-container{
    width: 90%;
    max-width: 650px;
    background-color: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow:1px 1px 2px black;}
    .form-header{
        margin-bottom: 30px;
        text-align: center;
        
        
        
        
    }
    .form-header h1{
        font-weight: bold;
        color:#1f2937;
        font-size:20px;

        margin-bottom: 8px;
    }
    input:focus,
    select:focus,
    textarea:focus {
    border-color: #2563eb;

    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}
.form-header p {
    margin: 0;
    color: #6b7280;
    font-size: 14px;
}.form-group{
    margin-bottom: 14px;
}
.form-group label{
    display: block;
    margin-bottom: 7px;
    font-size: 14px;
    font-weight:  600;

    color: #374151;
}
    </style>
</head>
<body>
    <body>

    <div class="form-container">

        <div class="form-header">
            <h1>Student Registration Form</h1>
            <p>Please fill in the details below</p>
        </div>

        <form>

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="college">College</label>
                <input type="text" id="college" placeholder="Enter your college name">
            </div>

            <div class="form-group">
                <label for="rollno">Roll Number</label>
                <input type="number" id="rollno" placeholder="Enter your roll number" required>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob">
            </div>

            <div class="form-group">
                <label for="course">Course</label>
                <input 
                    type="text" 
                    id="course"
                    value="Computer Science Engineering" 
                    disabled
                >
            </div>

            <div class="form-group">
                <label for="specialization">Specialization</label>

                <select id="specialization">
                    <option value="">Select specialization</option>
                    <option value="AI">Artificial Intelligence</option>
                    <option value="DS">Data Science</option>
                    <option value="Cybersecurity">Cybersecurity</option>
                    <option value="IOT">IoT</option>
                </select>
            </div>

            <div class="form-group">
                <label for="section">Section</label>

                <select id="section">
                    <option value="">Select section</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                </select>
            </div>

            <div class="form-group">
                <label>Subjects</label>

                <div class="radio-group">
                    <label>
                        <input type="radio" name="subject" value="HTML">
                        HTML
                    </label>

                    <label>
                        <input type="radio" name="subject" value="CSS">
                        CSS
                    </label>

                    <label>
                        <input type="radio" name="subject" value="AI">
                        AI
                    </label>

                    <label>
                        <input type="radio" name="subject" value="JavaScript">
                        JavaScript
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="marksheet">Upload Marksheet</label>
                <input type="file" id="marksheet">
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea 
                    id="address" 
                    rows="4" 
                    placeholder="Enter your address">
                </textarea>
            </div>

            <div class="button-group">
                <input type="submit" class="submitbutton" value="Submit">
                <input type="reset" class="resetbutton" value="Reset">
            </div>

        </form>

    </div>

</body>
</body>
</html>
