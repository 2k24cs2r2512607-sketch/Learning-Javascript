<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>//ctrl+shift+j--console window
        //block level scope -  u are allowed to use only let keyword, block ={-----}
        {let name="PSIT";//only accessible only on this block 
            document.write(name);
        }
        // document.write(name); not accessible
        // {
        //     var age=30;//behave like a global variable 
        //     document.write(age)

        // }
        // document.write(age);//global variable access allowed
        {
            const value="fifty";
            document.write(value);
        }
        document.write(value);//not accessible
    </script>
</body>
</html>
