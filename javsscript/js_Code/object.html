<!DOCTYPE html>
<html>
<head>
    <title>Object Example</title>
</head>
<body>

<h2>JavaScript Object</h2>

<script>

    let color = "blue";

    const a = {
        animal: "horse",
        legs: 4,
        color_of_animal: color
    };

    // Display object as a string
    document.write("The given object is: " + JSON.stringify(a) + "<br><br>");

    // Display data type
    document.write("Data Type: " + typeof a);

</script>

</body>
</html>
