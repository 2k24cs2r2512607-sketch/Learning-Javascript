<script>
    const myarray=[10,20,30,50];
    console.log(myarray);
    myarray[0]=23;
    console.log(myarray);
    console.log(typeof myarray);
    console.log([10,20,{name:'iram'},[234,234,234,2]]);
    // array is special type of object
    console.log(Array.isArray([1,3,'3']));//this check if a value is array or not
    console.log(myarray.length);
    // push==append in python
    myarray.push(100);
    console.log(myarray)
    // splice(index,number of values we want to remove)=remove element in the array
    myarray.splice(0,2);
    console.log(myarray);
    let i=1;
    while(i<=5){
        console.log(i);
        i = i + 1;
    }
    for(let i=1;i<=5;i++){
        console.log(i);
    }

    let randomnumber=0;
    while(randomnumber<0.5){
        randomnumber=Math.random();

    }
    console.log(randomnumber);
    

</script>
