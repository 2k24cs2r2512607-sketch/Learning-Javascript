 
     <!-- method in javascript is a function save inside the object -->
    <!DOCtype html>
    <html>
        <head>
            <title>JS</title>
            <body>
            <button>Hello</button>
             <!-- DOM is object -->
<script>

    // the document object represents/models the webpage
    document.body.innerHTML='<button>HTML</button>';
    document.title='javascript';
    console.log(document.title);
    console.log(typeof document.body);
    // The DOM combines javascript and html together
    // when html element is used inside <script> then the html element is converted into a javascript object
    console.log(typeof document.body.innerHTML);
    
</script>

        </body>
    </html>
