    <!DOCtype html>
    <html>
        <head>
            <title>DOM projects</title>
            <style>
                body{
                    font-family:Arial;
                }
                                  
                .subscribe-button{
                    border:none;
                    color:white;
                    background-color:black;
                    border-radius:20px;
                    padding:8px;
                    font-weight:bold;
                    cursor:pointer;
                    margin-bottom:30px;
                }
                .is-subscribed{
                    background-color:rgb(240, 240, 240);
                    color:black;
                }
                .cost-input{
                    font-size:15px;
                    padding:10px;
                } 
                 .calculate-button{
                    color:white;
                    background-color:rgb(25, 175, 25);
                    border:none;
                    font-size:15px;
                    padding:12px 15px;
                    cursor:pointer;
                 }   
            </style>
        </head>
        <body> 
            <p>YouTube Subscribe Button</p>
            <button
            onclick="
            subscribe();
            " class="js-subscribe-button subscribe-button">   Subscribe</button>
        <p>Amazon Shipping Calculator</p>
            <input type="number" class="js-cost cost-input" placeholder="Cost of Order" onkeydown="handlecosetkeydown(event);
            "  >
            <button onclick="calculateTotal();
             

            
            " class="calculate-button">Calculate</button>
            <p class="js-total-cost"></p>
         
<script>
    
    function handlecosetkeydown(event){

            if (event.key==='Enter'){
                calculateTotal();  

            }
    }
    function calculateTotal(){
        const inputelement = document.querySelector('.js-cost')
        let cost = Number(inputelement.value);//to get value typed in input (.value returns string)
         
        if (cost<40){
            cost = cost + 10;

        }
        document.querySelector('.js-total-cost').innerHTML =
        `$${cost}`;

    }
    function subscribe(){
        const btnelement = document.querySelector('.js-subscribe-button')
            if (btnelement.innerText==='Subscribe'){
                btnelement.innerHTML='Subscribed';
                btnelement.classList.add('is-subscribed'); 
            }
            // innerText removes extra space
            else{
                btnelement.innerHTML='Subscribe';
                btnelement.classList.remove('is-subscribed');
            }

    }
     
    

</script>

        </body>
    </html>
