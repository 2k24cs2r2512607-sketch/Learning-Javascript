     <!DOCtype html>
    <html>
        <head>
            <title>JS</title>
        </head>
        <body> 
<script>
    // Js comment
    let name=null;
    const value=name || 'Guest';
    document.write(value);
    /*JS COMMENT*/
</script>

        </body>
    </html>
