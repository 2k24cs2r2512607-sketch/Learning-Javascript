<!DOCTYPE html>
<html>
<head>
    <title>Date Example</title>
</head>
<body>

    <h2>JavaScript Date</h2>

    <script>

        // Create a Date object
        let today = new Date();

        // Display the complete date and time
        document.write("Current Date and Time: " + today + "<br><br>");

        // Display the data type
        document.write("Data Type: " + typeof(today));

    </script>

</body>
</html>
